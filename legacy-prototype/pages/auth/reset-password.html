<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | Sushrut Health</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div id="navbarContainer"></div>

  <div class="page-container" style="max-width: 480px; margin: 60px auto;">
    <div class="card" style="padding: 32px;">
      <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 8px;">Set New Password</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
        Choose a strong demonstration password for your account.
      </p>

      <form onsubmit="handleReset(event)">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" class="form-control" id="np1" required placeholder="Minimum 8 characters">
        </div>

        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" class="form-control" id="np2" required placeholder="Re-type new password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Update Password</button>
      </form>

      <div style="margin-top: 20px; text-align: center;">
        <a href="login.html" style="font-size: 0.9rem; color: var(--primary); font-weight: 500;">← Return to Sign In</a>
      </div>
    </div>
  </div>

  <div id="footerContainer"></div>

  <script src="../../js/demo-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/navigation.js"></script>
  <script>
    document.getElementById('navbarContainer').innerHTML = Components.renderPublicNavbar();
    document.getElementById('footerContainer').innerHTML = Components.renderPublicFooter();

    function handleReset(e) {
      e.preventDefault();
      const p1 = document.getElementById('np1').value;
      const p2 = document.getElementById('np2').value;
      if (p1 !== p2) {
        alert("Passwords do not match!");
        return;
      }
      alert("Password updated successfully in demo session! Please sign in.");
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
