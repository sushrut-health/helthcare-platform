<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Sushrut Health</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div id="navbarContainer"></div>

  <div class="page-container" style="max-width: 480px; margin: 60px auto;">
    <div class="card" style="padding: 32px;">
      <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 8px;">Reset Password</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">
        Enter your registered email address and we'll simulate sending a recovery reset link.
      </p>

      <form onsubmit="handleForgot(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="resetEmail" placeholder="name@domain.com" required value="aarav.patel@example.com">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Recovery Link (Simulated)</button>
      </form>

      <div style="margin-top: 20px; text-align: center;">
        <a href="login.html" style="font-size: 0.9rem; color: var(--primary); font-weight: 500;">← Return to Sign In</a>
      </div>
    </div>
  </div>

  <div id="footerContainer"></div>

  <script src="../../js/demo-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/navigation.js"></script>
  <script>
    document.getElementById('navbarContainer').innerHTML = Components.renderPublicNavbar();
    document.getElementById('footerContainer').innerHTML = Components.renderPublicFooter();

    function handleForgot(e) {
      e.preventDefault();
      alert("Demonstration Notice: Simulated reset link generated. Redirecting to password reset screen.");
      window.location.href = 'reset-password.html';
    }
  </script>
</body>
</html>
