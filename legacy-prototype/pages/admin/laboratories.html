<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratory Directory Oversight | Admin</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>

    <div class="main-content-wrapper">
      <div id="headerContainer"></div>

      <main class="page-container">
        <div style="margin-bottom: 24px;">
          <h1 style="font-size: 1.6rem; font-weight: 700;">Diagnostic Facilities Oversight</h1>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Manage diagnostic partner affiliations and facility compliance.</p>
        </div>

        <div class="card" style="padding:0; overflow:hidden;">
          <table class="table">
            <thead>
              <tr>
                <th>Laboratory</th>
                <th>Accreditation</th>
                <th>City</th>
                <th>Home Collection</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="adminLabsTable">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/demo-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/navigation.js"></script>
  <script>
    document.getElementById('sidebarContainer').innerHTML = Components.renderDashboardSidebar('admin', 'laboratories');
    document.getElementById('headerContainer').innerHTML = Components.renderDashboardHeader('admin', 'Laboratory Management', [
      { label: 'Admin Portal', href: 'dashboard.html' },
      { label: 'Laboratories', href: '#' }
    ]);

    const labs = Storage.get('laboratories') || DEMO_DATA.laboratories;
    document.getElementById('adminLabsTable').innerHTML = labs.map(l => `
      <tr>
        <td><strong>${l.name}</strong></td>
        <td>${l.regNo}</td>
        <td>${l.city}</td>
        <td>${l.homeCollection ? 'Yes' : 'No'}</td>
        <td><span class="badge ${l.status === 'Approved' ? 'badge-success' : 'badge-warning'}">${l.status}</span></td>
        <td>
          <a href="lab-verification.html?id=${l.id}" class="btn btn-outline btn-sm">Audit Record</a>
        </td>
      </tr>
    `).join('');
  </script>
</body>
</html>
