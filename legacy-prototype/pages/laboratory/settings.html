<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratory Settings | Sushrut Health</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>

    <div class="main-content-wrapper">
      <div id="headerContainer"></div>

      <main class="page-container" style="max-width: 800px;">
        <div style="margin-bottom: 24px;">
          <h1 style="font-size: 1.6rem; font-weight: 700;">Laboratory Operational Preferences</h1>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Notification rules, home collection radius, and credential security.</p>
        </div>

        <div class="card" style="padding: 32px;">
          <div class="form-group">
            <label class="form-label">Home Collection Service Radius</label>
            <select class="form-control">
              <option value="10">Within 10 km of facility</option>
              <option value="15" selected>Within 15 km of facility</option>
              <option value="25">Within 25 km of facility</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">SMS Alert for Home Collection Requests</label>
            <select class="form-control">
              <option value="enabled" selected>Instant Dispatch Alerts Enabled</option>
              <option value="disabled">Disabled</option>
            </select>
          </div>

          <div style="border-top:1px solid var(--border); padding-top:20px; margin-top:24px;">
            <button class="btn btn-primary" onclick="alert('Laboratory preferences saved.');">Save Preferences</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/demo-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/navigation.js"></script>
  <script>
    document.getElementById('sidebarContainer').innerHTML = Components.renderDashboardSidebar('laboratory', 'settings');
    document.getElementById('headerContainer').innerHTML = Components.renderDashboardHeader('laboratory', 'Lab Settings', [
      { label: 'Lab Portal', href: 'dashboard.html' },
      { label: 'Settings', href: '#' }
    ]);
  </script>
</body>
</html>
