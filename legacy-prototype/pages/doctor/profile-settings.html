<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Profile & Settings | Sushrut Health</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>

    <div class="main-content-wrapper">
      <div id="headerContainer"></div>

      <main class="page-container" style="max-width: 860px;">
        <div style="margin-bottom: 24px;">
          <h1 style="font-size: 1.6rem; font-weight: 700;">Doctor Profile & Clinic Information</h1>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Manage your public doctor bio, consultation fees, and practice credentials.</p>
        </div>

        <div class="card" style="padding: 32px;">
          <div style="display:flex; align-items:center; gap:20px; margin-bottom: 24px;">
            <div class="avatar avatar-lg" style="width:72px; height:72px; font-size:1.6rem;">AS</div>
            <div>
              <div style="display:flex; align-items:center; gap:8px;">
                <h3 style="font-size: 1.3rem; font-weight: 700;">Dr. Ananya Sharma</h3>
                <span class="badge badge-success">✓ Verified Practitioner</span>
              </div>
              <p style="color: var(--primary); font-size: 0.9rem; font-weight: 600;">Cardiologist &bull; Reg: MCI-2012-88231</p>
            </div>
          </div>

          <form onsubmit="handleSaveDocProfile(event)">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" value="Dr. Ananya Sharma" required>
              </div>
              <div class="form-group">
                <label class="form-label">Specialty</label>
                <input type="text" class="form-control" value="Cardiologist" required>
              </div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px;">
              <div class="form-group">
                <label class="form-label">Qualifications</label>
                <input type="text" class="form-control" value="MBBS, MD, DM (Cardiology)" required>
              </div>
              <div class="form-group">
                <label class="form-label">Consultation Fee (₹)</label>
                <input type="number" class="form-control" value="800" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Clinic Name & Address</label>
              <input type="text" class="form-control" value="Apex Heart & Vascular Centre, Bandra West, Mumbai" required>
            </div>

            <div class="form-group">
              <label class="form-label">Biography & Clinical Profile</label>
              <textarea class="form-control" rows="3">Senior consultant cardiologist with extensive expertise in preventative cardiology, hypertension management, and non-invasive cardiac imaging.</textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Update Professional Profile</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/demo-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/navigation.js"></script>
  <script>
    document.getElementById('sidebarContainer').innerHTML = Components.renderDashboardSidebar('doctor', 'profile-settings');
    document.getElementById('headerContainer').innerHTML = Components.renderDashboardHeader('doctor', 'Profile & Settings', [
      { label: 'Doctor Portal', href: 'dashboard.html' },
      { label: 'Settings', href: '#' }
    ]);

    function handleSaveDocProfile(e) {
      e.preventDefault();
      alert("Demonstration: Doctor profile changes saved in LocalStorage!");
    }
  </script>
</body>
</html>
