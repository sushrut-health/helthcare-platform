<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Prescriptions | Sushrut Health</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <div class="dashboard-layout">
    <div id="sidebarContainer"></div>

    <div class="main-content-wrapper">
      <div id="headerContainer"></div>

      <main class="page-container">
        <div style="margin-bottom: 24px;">
          <h1 style="font-size: 1.6rem; font-weight: 700;">Prescriptions Archive</h1>
          <p style="color: var(--text-muted); font-size: 0.9rem;">View medical prescriptions issued by authorized doctors with dosage directions.</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
            <div style="display:flex; gap:16px; align-items:center;">
              <div class="stat-icon" style="background:var(--primary-light); color:var(--primary);">💊</div>
              <div>
                <h3 style="font-size: 1.15rem; font-weight:700;">Rx - Mild Seasonal Viral Pharyngitis</h3>
                <p style="color:var(--primary); font-size:0.88rem; font-weight:500;">Dr. Rajesh Iyer &bull; General Physician</p>
                <p style="color:var(--text-muted); font-size:0.85rem; margin-top:2px;">Issued on 12 Sep 2026 &bull; Ref: RX001 (APT003)</p>
              </div>
            </div>
            <div>
              <a href="document-viewer.html?type=rx&id=RX001" class="btn btn-primary btn-sm">Open PDF Viewer</a>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/demo-data.js"></script>
  <script src="../../js/storage.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/navigation.js"></script>
  <script>
    document.getElementById('sidebarContainer').innerHTML = Components.renderDashboardSidebar('patient', 'prescriptions');
    document.getElementById('headerContainer').innerHTML = Components.renderDashboardHeader('patient', 'Prescriptions', [
      { label: 'Patient Portal', href: 'dashboard.html' },
      { label: 'Prescriptions', href: '#' }
    ]);
  </script>
</body>
</html>
